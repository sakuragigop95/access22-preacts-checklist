<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACCESS Documentations Checklist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f3f0f8;
  --card: #ffffff;
  --ink: #1d1433;
  --muted: #6b6082;
  --line: #e0d9ee;
  --brand: #6d3fd1;
  --brand-soft: #efe8fc;
  --yes: #12805c;
  --yes-soft: #dcf4ea;
  --no: #c93a4b;
  --no-soft: #fde6e9;
  --head: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "Figtree", "Segoe UI", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150f24; --card: #1f1636; --ink: #efeaf8; --muted: #a99fc0; --line: #35294f;
    --brand: #b497ff; --brand-soft: #33225c; --yes: #4cd6a0; --yes-soft: #123b30;
    --no: #ff7b8b; --no-soft: #43202a;
  }
}
:root[data-theme="dark"] {
  --bg: #150f24; --card: #1f1636; --ink: #efeaf8; --muted: #a99fc0; --line: #35294f;
  --brand: #b497ff; --brand-soft: #33225c; --yes: #4cd6a0; --yes-soft: #123b30;
  --no: #ff7b8b; --no-soft: #43202a;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 90px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--body);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

.hero h1 { text-shadow: 0 2px 8px rgba(0,0,0,.35); margin: 0 0 6px; font: 800 clamp(1.7rem, 4.5vw, 2.4rem)/1.1 var(--head); letter-spacing: -.02em; }
.hero p { margin: 0; opacity: .9; }

/* Details */
.details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.details label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 5px; color: var(--muted); }
.details input {
  width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
}
.details input:focus { outline: 3px solid var(--brand-soft); border-color: var(--brand); }

/* Sticky progress */
.progress {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(20, 38, 61, .08);
}
.ring { --p: 0; width: 46px; height: 46px; flex: none; border-radius: 50%;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--line) 0);
  display: grid; place-items: center; }
.ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--card);
  display: grid; place-items: center; font: 700 .72rem var(--head); }
.progress-text { flex: 1; min-width: 0; }
.progress-text strong { display: block; font: 700 1rem var(--head); }
.progress-text small { color: var(--muted); }
.flags { font-weight: 600; font-size: .85rem; color: var(--no); background: var(--no-soft);
  padding: 4px 10px; border-radius: 99px; }
.flags[hidden] { display: none; }

/* Sections */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 14px; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 15px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { margin: 0; font: 700 1.05rem/1.3 var(--head); }
.tally { flex: none; font-size: .82rem; font-weight: 600; padding: 3px 10px; border-radius: 99px;
  background: var(--brand-soft); color: var(--brand); }
.card.done .tally { background: var(--yes-soft); color: var(--yes); }
.card.done .card-head { background: var(--yes-soft); }
.note { margin: 0; padding: 10px 18px; font-size: .9rem; color: var(--muted); background: var(--brand-soft); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 13px 18px 13px 15px; border-left: 3px solid transparent; border-bottom: 1px solid var(--line);
  transition: background .15s, border-color .15s; }
.row:last-child { border-bottom: 0; }
.row p { margin: 0; overflow-wrap: anywhere; }
.row[data-state="yes"] { border-left-color: var(--yes); }
.row[data-state="no"] { border-left-color: var(--no); background: var(--no-soft); }

.toggle { display: flex; flex: none; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle label { padding: 6px 16px; border-radius: 8px; font-weight: 600; font-size: .92rem;
  color: var(--muted); cursor: pointer; user-select: none; transition: background .15s, color .15s; }
.toggle input[value="yes"]:checked + label { background: var(--yes); color: #fff; }
.toggle input[value="no"]:checked + label { background: var(--no); color: #fff; }
.toggle input:focus-visible + label { outline: 3px solid var(--brand); outline-offset: 1px; }

/* Completion */
.done-banner { display: none; align-items: center; gap: 16px; background: var(--yes); color: #fff;
  border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; animation: pop .35s ease-out; }
.done-banner.show { display: flex; }
.done-banner svg { flex: none; width: 44px; height: 44px; }
.done-banner h3 { margin: 0; font: 800 1.25rem/1.3 var(--head); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

.reset { margin-top: 8px; padding: 11px 18px; font: 600 1rem var(--body); color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.reset:hover { border-color: var(--brand); color: var(--brand); }

@media (max-width: 620px) {
  .details { grid-template-columns: 1fr; }
  .row { flex-direction: column; align-items: flex-start; gap: 10px; }
  .hero { padding: 22px 20px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>ACCESS Documentations Checklist</h1>
    <p>Check the A-Form and PPR line by line. Answer every item to finish.</p>
  </div>

  <div class="details">
    <div><label for="activityTitle">Activity title</label><input id="activityTitle" type="text" placeholder="Enter the activity title"></div>
    <div><label for="checkedBy">Checked by</label><input id="checkedBy" type="text" placeholder="Enter your name"></div>
  </div>

  <div class="progress" aria-live="polite">
    <div class="ring" id="ring"><span id="ringPct">0%</span></div>
    <div class="progress-text"><strong id="progressTitle">Not started</strong><small id="progressSub"></small></div>
    <span class="flags" id="flags" hidden></span>
  </div>

  <div class="done-banner" id="doneBanner" role="status">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M14 25l7 7 13-15"/></svg>
    <h3>Pre-Acts are fully checked. Forward to your AVP/VP for final checking.</h3>
  </div>

  <form id="checklist" autocomplete="off"></form>

  <button class="reset" type="button" id="reset">Reset checklist</button>
</div>

<script>
const sections = [
  { title: "A-Form", items: [
    "Title of Activity is EXACTLY the same in GOSM",
    "Nature of Activity is the same in GOSM",
    "Type of Activity is the same in GOSM",
    "Date is correct? Yearlong / Termlong / September 1, 2026 / September 1–5, 2026",
    "Time is consistent with PPR?",
    "Venue is “Please See PPR”?",
    "ENP is greater than or equal to ENMP?",
    "Online Activity"
  ]},
  { title: "PPR Section 1: Activity Details", items: [
    "Title of Activity is exactly the same in A-Form and GOSM",
    "Nature of Activity is exactly the same in A-Form and GOSM",
    "Type of Activity is exactly the same in A-Form and GOSM",
    "Date is exactly the same in A-Form",
    "ENP is greater than or equal to ENMP?",
    "Time is exactly the same in A-Form",
    "Venue is accurate with Logistics reservation/Pre-Registration and GALS link is accessible/Zoom link is accessible?",
    "Project heads are not greater than 5?",
    "Contact numbers match the number of project heads?",
    "Emails match the number and order of project heads?"
  ]},
  { title: "PPR Section 2: Brief Context", items: [
    "Exactly 3 paragraphs and relevant to the activity"
  ]},
  { title: "PPR Section 3: Objectives", items: [
    "Objectives are exactly the same in GOSM?"
  ]},
  { title: "PPR Section 4.1: 1st CPD", note: "Remember to count the starting date for the duration.", items: [
    "Preparation of Pre-Acts and its duration count is accurate?",
    "Submission of Pre-Acts and its duration count is accurate?",
    "Activity Proper and its duration count is accurate?",
    "ORGRES Member Feedback and its duration count is accurate?",
    "Preparation of Post-Acts and its duration is accurate?",
    "Submission of Post-Acts and its duration is accurate?",
    "Dates are not overlapped?",
    "Preparation and submission dates of Post-Acts are after the Activity Proper?"
  ]},
  { title: "PPR Section 4.2: 2nd CPD", items: [
    "Venue/Date/Time are consistent with A-Form?",
    "Preparation and Registration time is before the start of the event?",
    "CSO ORGRES is scheduled at least 5 minutes before the event ends?",
    "For F2F Events, cleanup is 15–30 minutes after the event?",
    "Time is continuous for each section?",
    "Icebreakers follow the format “Icebreaker: Name of Icebreaker”?",
    "Speaker portion follows the format “Speaker: Name of Speaker”?"
  ]},
  { title: "PPR Section 5: Breakdown of Expenses", items: [
    "All projected expenses, including x-deals, are indicated?",
    "If the activity incurs no expenses, N/A is indicated for all boxes?",
    "Total expenses are LESS THAN OR EQUAL TO the declared activity budget?",
    "All values follow the Php and .00 format?"
  ]},
  { title: "PPR Section 6: Allocation of Expenses", items: [
    "Total projected expenses from Section 6 are EQUAL to the declared amount in Section 5?",
    "Organization funds match the totals in Section 5?",
    "Participant’s Fee is N/A?",
    "Others is N/A?",
    "All values follow the Php and .00 format?",
    "If there are NO EXPENSES, “THE ACTIVITY WILL NOT INCUR ANY EXPENSES; THUS, IT WILL NOT NEED FUNDING.” is indicated?"
  ]},
  { title: "PPR Section 7: Projected Income", note: "Activities with Projected Income are processed through SLIFE.", items: [
    "Total Expenses are consistent with the amount in Section 5?",
    "If there is NO INCOME, “THE ACTIVITY IS NOT A FUNDRAISING/SELLING ACTIVITY; THUS, IT WILL NOT INCUR INCOME OR LOSS.” is indicated?"
  ]},
  { title: "PPR Section 8: Summary of Funds", items: [
    "Operational fund is N/A?",
    "Depository fund is as of September 3, 2026?",
    "Participants Fee/Donation/Sponsorships are consistent with Section 7 or N/A?",
    "Total projected expenses are consistent with Section 5?",
    "All values follow the Php and .00 format?",
    "VP Finance signature is present?"
  ]},
  { title: "PPR Section 9: Provisions of Profit and Loss", items: [
    "Signatory on the right has a higher position than the one on the left?",
    "All signatures and names are present?"
  ]}
];

const form = document.getElementById("checklist");
let id = 0;

form.innerHTML = sections.map(s => `
  <section class="card">
    <div class="card-head"><h2>${s.title}</h2><span class="tally"></span></div>
    ${s.note ? `<p class="note">${s.note}</p>` : ""}
    ${s.items.map((text, i) => {
      id++;
      return `<div class="row">
        <p>${i + 1}. ${text}</p>
        <div class="toggle">
          <input type="radio" name="q${id}" id="q${id}y" value="yes"><label for="q${id}y">Yes</label>
          <input type="radio" name="q${id}" id="q${id}n" value="no"><label for="q${id}n">No</label>
        </div>
      </div>`;
    }).join("")}
  </section>`).join("");

const $ = sel => document.querySelector(sel);

function refresh() {
  let yes = 0, no = 0, total = 0;

  form.querySelectorAll(".card").forEach(card => {
    const rows = [...card.querySelectorAll(".row")];
    let cardYes = 0;
    rows.forEach(row => {
      const picked = row.querySelector("input:checked");
      row.dataset.state = picked ? picked.value : "";
      if (picked?.value === "yes") { yes++; cardYes++; }
      if (picked?.value === "no") no++;
    });
    total += rows.length;
    card.classList.toggle("done", cardYes === rows.length);
    card.querySelector(".tally").textContent = `${cardYes}/${rows.length} yes`;
  });

  const answered = yes + no;
  const pct = Math.round((yes / total) * 100);
  const complete = yes === total;

  $("#ring").style.setProperty("--p", pct);
  $("#ringPct").textContent = pct + "%";
  $("#progressTitle").textContent = complete ? "All items passed"
    : answered === 0 ? "Not started" : `${answered} of ${total} answered`;
  $("#progressSub").textContent = complete ? "" : `${total - answered} left to check`;

  $("#flags").hidden = no === 0;
  $("#flags").textContent = `${no} to fix`;
  $("#doneBanner").classList.toggle("show", complete);
}

form.addEventListener("change", refresh);

$("#reset").addEventListener("click", () => {
  if (!confirm("Clear all answers and the activity details?")) return;
  form.reset();
  $("#activityTitle").value = "";
  $("#checkedBy").value = "";
  refresh();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

refresh();
</script>
</body>
</html>
